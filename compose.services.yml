# Sibling checkouts plus an isolated, seeded database. Run setup.cmd/sh services.
name: umamoe-collaboration

services:
  postgres:
    extends:
      file: compose.local.yml
      service: postgres

  redis:
    extends:
      file: compose.local.yml
      service: redis

  demo-db:
    extends:
      file: compose.local.yml
      service: demo-db

  backend:
    extends:
      file: compose.local.yml
      service: backend
    environment:
      SEARCH_SERVICE_URL: http://search:3202
      BROWSER_PROOF_INTERNAL_HOST: 0.0.0.0
      BROWSER_PROOF_INTERNAL_PORT: 3201
      FRONTEND_URL: http://localhost:${LOCAL_FRONTEND_PORT:-4200}
      OAUTH_REDIRECT_BASE_URL: http://localhost:${DEMO_BACKEND_PORT:-3001}

  resources:
    build:
      context: ../umamoe-resources
    environment:
      DEBUG_MODE: "true"
      API_PROTECTION_BYPASS: "true"
      AUTH_INTERNAL_BASE_URL: http://backend:3201
      RESOURCES_INTERNAL_HOST: 0.0.0.0
      RESOURCES_INTERNAL_PORT: 3204
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: umamoe-demo
      ALLOWED_ORIGINS: http://localhost:${LOCAL_FRONTEND_PORT:-4200},http://127.0.0.1:${LOCAL_FRONTEND_PORT:-4200}
    volumes:
      - resources-data:/data
      - type: bind
        source: ../umamoe-resources/master.mdb
        target: /data/master.mdb
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${LOCAL_RESOURCES_PORT:-3004}:3000"
    depends_on:
      redis:
        condition: service_healthy

  search:
    build:
      context: ../umamoe_db
    environment:
      DATABASE_URL: postgresql://umamoe_demo:umamoe_demo@postgres:5432/umamoe_demo
      RESOURCE_BASE_URL: http://resources:3204/resources
      SEARCH_PORT: 3002
      SEARCH_INTERNAL_PORT: 3202
      INCLUDE_STALE_TRAINERS: "true"
      API_PROTECTION_BYPASS: "true"
      AUTH_INTERNAL_BASE_URL: http://backend:3201
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: umamoe-demo
      ALLOWED_ORIGINS: http://localhost:${LOCAL_FRONTEND_PORT:-4200},http://127.0.0.1:${LOCAL_FRONTEND_PORT:-4200}
    ports:
      - "127.0.0.1:${LOCAL_SEARCH_PORT:-3002}:3002"
    depends_on:
      demo-db:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      resources:
        condition: service_healthy

  frontend:
    build:
      context: ../umamoe-frontend
      # The frontend's production Dockerfile exports static files, not a server.
      dockerfile_inline: |
        FROM node:20-bookworm-slim
        WORKDIR /app
        COPY package*.json ./
        RUN npm ci --include=dev
        COPY angular.json tsconfig*.json ./
    command: ["npm", "start", "--", "--host", "0.0.0.0", "--proxy-config", "/config/proxy.json", "--poll", "1000"]
    environment:
      NG_CLI_ANALYTICS: "false"
    volumes:
      - ../umamoe-frontend/src:/app/src:ro
      - ./deploy/demo/frontend-proxy.json:/config/proxy.json:ro
    ports:
      - "127.0.0.1:${LOCAL_FRONTEND_PORT:-4200}:4200"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 30
    depends_on:
      backend:
        condition: service_healthy
      search:
        condition: service_healthy

  embeds:
    build:
      context: ../umamoe-embeds
    environment:
      UMAMOE_FRONTEND_ORIGIN: http://frontend:4200
      UMAMOE_PUBLIC_BASE_URL: http://localhost:${LOCAL_EMBEDS_PORT:-3008}
      UMAMOE_ASSET_BASE_URL: http://frontend:4200/assets
      UMAMOE_API_BASE_URL: http://backend:3201
      UMAMOE_SEARCH_BASE_URL: http://search:3202
      UMAMOE_RESOURCES_BASE_URL: http://resources:3204/resources
    ports:
      - "127.0.0.1:${LOCAL_EMBEDS_PORT:-3008}:8080"
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  postgres-data:
  resources-data:
