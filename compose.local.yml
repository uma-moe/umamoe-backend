# Self-contained, disposable development stack. No .env or sibling repos required.
name: umamoe-demo

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: umamoe_demo
      POSTGRES_PASSWORD: umamoe_demo
      POSTGRES_DB: umamoe_demo
    ports:
      - "127.0.0.1:${DEMO_DATABASE_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/demo/check.sql:/demo/check.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umamoe_demo -d umamoe_demo"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  demo-db:
    build:
      context: .
      target: demo
    environment:
      DEMO_DATABASE_URL: postgresql://umamoe_demo:umamoe_demo@postgres:5432/umamoe_demo
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://umamoe_demo:umamoe_demo@postgres:5432/umamoe_demo
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: umamoe-demo
      HOST: 0.0.0.0
      PORT: 3001
      DEBUG_MODE: "true"
      JWT_SECRET: local-demo-jwt-secret-not-for-production
      BROWSER_PROOF_SECRET: local-demo-browser-secret-not-for-production
      BROWSER_PROOF_COOKIE_SECURE: "false"
      API_PROTECTION_BYPASS: "true"
      DISABLE_DB_BACKGROUND_JOBS: "true"
      DISABLE_BOOKMARK_HASH_BACKFILL: "true"
      ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200,http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
      FRONTEND_URL: http://localhost:4200
      OAUTH_REDIRECT_BASE_URL: http://localhost:3001
      # These optional services are not part of the standalone demo.
      SEARCH_SERVICE_URL: http://127.0.0.1:3202
      SIMULATOR_URL: http://127.0.0.1:3009
    ports:
      - "127.0.0.1:${DEMO_BACKEND_PORT:-3001}:3001"
    depends_on:
      demo-db:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
